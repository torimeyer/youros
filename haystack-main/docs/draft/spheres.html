<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ostk sphere topology</title>
<style>
  body { background: #1a1a2e; color: #e0e0e0; font-family: Menlo, monospace; margin: 0; padding: 20px; }
  svg { width: 100%; height: 100vh; }
  .sphere { rx: 12; ry: 12; stroke-width: 2; }
  .hay { rx: 4; ry: 4; stroke-dasharray: 4,2; }
  text { font-family: Menlo, monospace; }
  .bridge { stroke-dasharray: 6,3; }
  .joint { stroke-width: 2; }
  .label { font-size: 10px; fill: #999; }
  .title { font-size: 11px; font-weight: bold; }
  .count { font-size: 9px; fill: #666; }
</style></head><body>
<svg viewBox="0 0 1200 700">
  <!-- Sphere 1: →975 agent loop (mega) -->
  <rect x="20" y="20" width="340" height="280" class="sphere" fill="#16213e" stroke="#334466"/>
  <text x="40" y="50" class="title" fill="#7ec8e3">Sphere 1 — →975  agent loop</text>
  <text x="40" y="68" class="count">126 needles | d46 | radius=3</text>
  <rect x="40" y="80" width="140" height="28" rx="4" fill="#0f3460"/>
  <text x="50" y="99" font-size="10" fill="#e0e0e0">→975 (point)</text>
  <rect x="40" y="115" width="140" height="24" rx="4" fill="#1a1a40"/>
  <text x="50" y="132" font-size="9" fill="#aac">→1000 fcp-rust lifecycle</text>
  <rect x="40" y="145" width="140" height="24" rx="4" fill="#1a1a40"/>
  <text x="50" y="162" font-size="9" fill="#aac">→1001 embedding index</text>
  <rect x="40" y="175" width="140" height="24" rx="4" fill="#1a1a40"/>
  <text x="50" y="192" font-size="9" fill="#aac">→1098 status bar</text>
  <rect x="40" y="205" width="140" height="24" rx="4" fill="#1a1a40"/>
  <text x="50" y="222" font-size="9" fill="#aac">→1099 Alt+key macOS</text>
  <text x="50" y="252" font-size="9" fill="#555">...+121 more needles</text>
  <!-- bridged hay -->
  <rect x="200" y="80" width="140" height="24" rx="4" class="hay" fill="#2a2a3a" stroke="#555577"/>
  <text x="210" y="97" font-size="9" fill="#88c">OSTK (2 hay)</text>
  <rect x="200" y="110" width="140" height="24" rx="4" class="hay" fill="#2a2a3a" stroke="#555577"/>
  <text x="210" y="127" font-size="9" fill="#88c">FCP-RUST (2 hay)</text>
  <rect x="200" y="140" width="140" height="24" rx="4" class="hay" fill="#2a2a3a" stroke="#555577"/>
  <text x="210" y="157" font-size="9" fill="#88c">BENCH (2 hay)</text>
  <rect x="200" y="170" width="140" height="24" rx="4" class="hay" fill="#2a2a3a" stroke="#555577"/>
  <text x="210" y="187" font-size="9" fill="#88c">AGENT (2 hay)</text>
  <rect x="200" y="200" width="140" height="24" rx="4" class="hay" fill="#2a2a3a" stroke="#555577"/>
  <text x="210" y="217" font-size="9" fill="#88c">THREAD (2 hay)</text>
  <text x="210" y="247" font-size="9" fill="#555">+5 more bridged</text>

  <!-- Sphere 2: →888 daemon (P0) -->
  <rect x="400" y="20" width="340" height="200" class="sphere" fill="#1a2e1a" stroke="#336644"/>
  <text x="420" y="50" class="title" fill="#7ee38a">Sphere 2 — →888  unified daemon [P0]</text>
  <text x="420" y="68" class="count">3 needles | d2 | radius=1</text>
  <rect x="420" y="80" width="180" height="28" rx="4" fill="#0f4020"/>
  <text x="430" y="99" font-size="10" fill="#e0e0e0">→888 kernel glob/grep (point)</text>
  <rect x="420" y="115" width="180" height="24" rx="4" fill="#1a401a"/>
  <text x="430" y="132" font-size="9" fill="#aca">→889 spawn/interact/lock</text>
  <rect x="420" y="145" width="180" height="24" rx="4" fill="#1a401a"/>
  <text x="430" y="162" font-size="9" fill="#aca">→890 needle/hay native</text>
  <!-- joints -->
  <line x1="510" y1="108" x2="510" y2="115" class="joint" stroke="#4a7a4a"/>
  <line x1="510" y1="108" x2="510" y2="145" class="joint" stroke="#4a7a4a"/>
  <!-- bridged hay -->
  <rect x="620" y="80" width="100" height="28" rx="4" class="hay" fill="#2a3a2a" stroke="#4a7a4a"/>
  <text x="630" y="99" font-size="10" fill="#8c8">DAEMON</text>
  <text x="630" y="115" font-size="8" fill="#686">2 hay</text>
  <line x1="620" y1="94" x2="600" y2="94" class="bridge" stroke="#7ee38a"/>

  <!-- Sphere 3: →654 HUMANFILE -->
  <rect x="780" y="20" width="200" height="130" class="sphere" fill="#2e1a2e" stroke="#664466"/>
  <text x="800" y="50" class="title" fill="#e37ec8">Sphere 3 — →654</text>
  <text x="800" y="68" class="count">HUMANFILE | 2 needles</text>
  <rect x="800" y="80" width="160" height="24" rx="4" fill="#401a40"/>
  <text x="810" y="97" font-size="9" fill="#e0e0e0">→654 HUMANFILE accum</text>
  <rect x="800" y="110" width="160" height="24" rx="4" fill="#301a30"/>
  <text x="810" y="127" font-size="9" fill="#cac">→701 ostk should</text>

  <!-- Sphere 4: →655 Agentfile -->
  <rect x="780" y="170" width="200" height="130" class="sphere" fill="#2e2e1a" stroke="#666644"/>
  <text x="800" y="200" class="title" fill="#e3c87e">Sphere 4 — →655</text>
  <text x="800" y="218" class="count">Agentfile | 2 needles</text>
  <rect x="800" y="230" width="160" height="24" rx="4" fill="#40401a"/>
  <text x="810" y="247" font-size="9" fill="#e0e0e0">→655 Agentfile spawn</text>
  <rect x="800" y="260" width="160" height="24" rx="4" fill="#30301a"/>
  <text x="810" y="277" font-size="9" fill="#cca">→658 PROMPT_ARG</text>

  <!-- Sphere 5: →675 active delta -->
  <rect x="400" y="240" width="200" height="130" class="sphere" fill="#1a2e2e" stroke="#446666"/>
  <text x="420" y="270" class="title" fill="#7ee3e3">Sphere 5 — →675</text>
  <text x="420" y="288" class="count">active delta | 2 needles</text>
  <rect x="420" y="300" width="160" height="24" rx="4" fill="#1a4040"/>
  <text x="430" y="317" font-size="9" fill="#e0e0e0">→675 active.tack</text>
  <rect x="420" y="330" width="160" height="24" rx="4" fill="#1a3030"/>
  <text x="430" y="347" font-size="9" fill="#acc">→686 tack-boot</text>

  <!-- Floating hay (no bridge) -->
  <rect x="20" y="340" width="340" height="120" rx="8" fill="#111122" stroke="#333344" stroke-dasharray="4,2"/>
  <text x="40" y="365" class="title" fill="#888899">Unbridged Hay</text>
  <rect x="40" y="380" width="90" height="24" rx="4" class="hay" fill="#2a2a3a" stroke="#555577"/>
  <text x="50" y="397" font-size="9" fill="#88c">IDEA (6)</text>
  <rect x="140" y="380" width="110" height="24" rx="4" class="hay" fill="#2a2a3a" stroke="#555577"/>
  <text x="150" y="397" font-size="9" fill="#88c">THOUGHT (6)</text>
  <rect x="260" y="380" width="80" height="24" rx="4" class="hay" fill="#3a2a2a" stroke="#555577"/>
  <text x="270" y="397" font-size="9" fill="#c88">SEE (2)</text>
  <text x="40" y="440" font-size="10" fill="#555">141 unclustered hay entries</text>

  <!-- 212 isolated spheres note -->
  <text x="20" y="500" font-size="11" fill="#444466">212 isolated spheres (single-needle, no joints)</text>
  <text x="20" y="520" font-size="10" fill="#333">5 connected spheres shown above | 347 open needles | 16 hay clusters</text>

  <!-- Legend -->
  <rect x="20" y="560" width="300" height="120" rx="6" fill="#111118" stroke="#222233"/>
  <text x="40" y="585" font-size="10" fill="#888">Legend</text>
  <rect x="40" y="595" width="16" height="12" rx="2" fill="#0f3460"/>
  <text x="65" y="605" font-size="9" fill="#888">Sphere point (most connected needle)</text>
  <rect x="40" y="615" width="16" height="12" rx="2" fill="#1a1a40"/>
  <text x="65" y="625" font-size="9" fill="#888">Sphere member needle</text>
  <rect x="40" y="635" width="16" height="12" rx="2" fill="#2a2a3a" stroke="#555577" stroke-dasharray="2,1"/>
  <text x="65" y="645" font-size="9" fill="#888">Hay cluster (embedding-discovered)</text>
  <line x1="40" y1="660" x2="56" y2="660" stroke="#7ee38a" stroke-dasharray="4,2"/>
  <text x="65" y="664" font-size="9" fill="#888">Jaccard bridge (hay → sphere)</text>
</svg>
</body></html>
