[tool]
name = "eza"
detect = ["eza"]

# ---- llm hints ----

[[llm_hints]]
prefer = "eza --oneline"
reason = "one filename per line, minimal tokens; add -l only when permissions/size needed"

[[llm_hints]]
prefer = "eza --tree --level=2"
reason = "unbounded --tree can emit thousands of lines; cap depth"

# ---- global noise ----

[[global_noise]]
# Standalone git status marker lines (--  -M  -N  etc.)
pattern = '^\s*[-MNADRC?!]{1,2}\s*$'
action = "strip"

# ---- fallback (eza has no subcommands) ----

[fallback]

[[fallback.noise]]
# Tree branch indicators (lines of just "│  " or "├── " or "└── ")
pattern = '^[│├└─┬╰╭─\s]+$'
action = "strip"

[[fallback.noise]]
# Repeated directory entries in tree view
pattern = '^\s*[│├└─\s]*\.\s*$'
action = "strip"

[[fallback.outcome]]
# Summary line from eza (when available)
pattern = '(?P<files>\d+)\s+files?,\s+(?P<dirs>\d+)\s+director'
action = "promote"
captures = ["files", "dirs"]

[[fallback.hazard]]
pattern = 'No such file or directory'
severity = "error"
action = "keep"

[[fallback.hazard]]
pattern = 'Permission denied'
severity = "error"
action = "keep"

[fallback.summary]
success = "+ listed ({files} files, {dirs} directories)"
failure = "! eza failed (exit {exit_code})"
partial = "... listing ({lines} lines)"

# No block compression — file listings contain unique filenames/sizes.
# Default line-dedup handles true duplicates (e.g. repeated "total" lines).
