[tool]
name = "head"
detect = ["head"]

[[llm_hints]]
prefer = "fs_read('read <path>')"
reason = "fs_read reads files directly with line offset/limit support"
mode = "mcp"

[[llm_hints]]
prefer = "fs_ops 'read <path>'"
reason = "fs_ops reads files directly with line offset/limit support"
mode = "cli"
