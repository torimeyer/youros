[tool]
name = "bat"
detect = ["bat", "batcat"]

# ---- llm hints ----

[[llm_hints]]
prefer = "fs_read('read <path>')"
reason = "fs_read reads files directly -- no shell overhead, no decorations to strip"
mode = "mcp"

[[llm_hints]]
prefer = "fs_ops 'read <path>'"
reason = "fs_ops reads files directly -- no shell overhead, no decorations to strip"
mode = "cli"

[[llm_hints]]
prefer = "bat --plain"
reason = "strips line numbers, headers, and separators -- fewer tokens when bat is required"

# ---- global noise ----

[[global_noise]]
# Decorative separator lines (───────, ═══════, etc.)
pattern = '^[─━═┄┅┈┉╌╍]{3,}\s*$'
action = "strip"

[[global_noise]]
# File header decoration ("File: path/to/file")
pattern = '^\s*File:\s+'
action = "strip"

[[global_noise]]
# Language detection line ("Language: rust" etc.)
pattern = '^\s*Language:\s+'
action = "strip"

[[global_noise]]
# Theme/grid border lines
pattern = '^[├┤┬┴┼│┃┆┇┊┋]+[─━═]*[├┤┬┴┼│┃┆┇┊┋]*\s*$'
action = "strip"

# ---- fallback (bat has no subcommands) ----

[fallback]

[[fallback.noise]]
# Empty gutter lines (line number with no content after separator)
pattern = '^\s+\d+\s[│|]?\s*$'
action = "strip"

[[fallback.hazard]]
pattern = 'No such file or directory'
severity = "error"
action = "keep"

[[fallback.hazard]]
pattern = 'Permission denied'
severity = "error"
action = "keep"

[[fallback.hazard]]
pattern = "error: '.*' is a directory"
severity = "error"
action = "keep"

[fallback.summary]
success = "+ displayed ({lines} lines)"
failure = "! bat failed (exit {exit_code})"
partial = "... reading ({lines} lines)"
