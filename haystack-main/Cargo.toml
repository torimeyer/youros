[package]
name = "ostk"
version = "2.3.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
fs2 = "0.4"
nix = { version = "0.29", features = ["term", "signal", "process", "poll", "fs", "mount"] }
libc = "0.2"
vte = "0.13"
regex = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"], default-features = false }
futures-util = "0.3"
crossterm = "0.28"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info", "unstable-widget-ref"] }
ratatui-textarea = "0.8"
wait-timeout = "0.2"
notify = { version = "6", features = ["macos_fsevent"] }
color-eyre = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = "3.4"
fuser = { version = "0.17", optional = true }
unicode-width = "0.2"
pulldown-cmark = "0.12"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ostk"
path = "src/main.rs"

[features]
default = []
embeddings = ["dep:burn", "dep:tokenizers", "dep:safetensors"]
fuse = ["dep:fuser"]

[dependencies.burn]
version = "0.20.0"
optional = true
default-features = false
features = ["std", "ndarray", "wgpu", "metal", "fusion"]

[dependencies.tokenizers]
version = "0.21"
optional = true
default-features = false
features = ["onig"]

[dependencies.safetensors]
version = "0.5"
optional = true


