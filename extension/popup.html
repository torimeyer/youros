<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myOS Gemini Capture</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 240px;
      padding: 16px;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px;
      color: #f1f5f9;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
    }
    .status.on { color: #4ade80; }
    .status.off { color: #64748b; }
    label { font-size: 13px; }
    input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #3b82f6; }
    a { font-size: 11px; color: #60a5fa; text-decoration: none; display: block; margin-top: 12px; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>myOS Gemini Capture</h1>
  <div class="row">
    <label for="toggle">Capture conversations</label>
    <input type="checkbox" id="toggle" />
  </div>
  <p class="status" id="status">Capture is OFF</p>
  <a href="options.html" target="_blank">Settings</a>
  <script src="popup.js"></script>
</body>
</html>
