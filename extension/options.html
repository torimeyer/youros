<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myOS Gemini Capture — Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 24px;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 24px; color: #f1f5f9; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 20px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .saved { color: #4ade80; font-size: 12px; margin-left: 12px; display: none; }
    p.hint { font-size: 12px; color: #64748b; margin-top: 4px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>myOS Gemini Capture Settings</h1>

  <label for="backendUrl">Backend URL</label>
  <input type="text" id="backendUrl" placeholder="http://127.0.0.1:8000" />
  <p class="hint">The address of your local myOS backend. Default: http://127.0.0.1:8000</p>

  <label for="authToken">Auth token</label>
  <input type="password" id="authToken" placeholder="Paste your token here" />
  <p class="hint">
    Find your token at <code>~/.myos/extension_token</code> on your Mac.
    It's created automatically when the backend starts.
  </p>

  <button id="save">Save</button>
  <span class="saved" id="saved">Saved!</span>

  <script src="options.js"></script>
</body>
</html>
