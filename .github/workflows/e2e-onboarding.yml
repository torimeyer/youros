name: E2E Onboarding

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'api/**'
      - 'scripts/**'
      - '.github/workflows/e2e-onboarding.yml'

jobs:
  e2e-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install Python dependencies
        run: pip install -r api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: app

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: app

      - name: Create yourOS data directory
        run: mkdir -p ~/.youros

      - name: Run e2e onboarding tests
        run: npx playwright test
        working-directory: app
        env:
          CI: true
          E2E_BASE_URL: http://localhost:3010

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-onboarding-results
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 7

  # Gate the failure class new users actually hit: ostk missing/unhealthy, or
  # "installed but the chat never responds". Uses YOUROS_MOCK_LLM so the chat
  # path is exercised over the real WebSocket without Anthropic/Gemini creds.
  install-health-and-chat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install Python dependencies
        run: pip install -r api/requirements.txt

      - name: Install ostk and check health
        run: |
          set -e
          OSTK_BIN="$HOME/.local/bin"
          mkdir -p "$OSTK_BIN"
          ARCH="$(uname -m)"
          [ "$ARCH" = "arm64" ] && ARCH="aarch64"
          VER="$(curl -fsSL https://api.github.com/repos/os-tack/ostk.ai/releases/latest | grep '"tag_name"' | head -1 | cut -d'"' -f4)"
          if [ -z "$VER" ]; then echo "Could not resolve latest ostk version"; exit 1; fi
          curl -fsSL "https://github.com/os-tack/ostk.ai/releases/download/${VER}/ostk-${VER#v}-${ARCH}-unknown-linux-musl.tar.gz" -o /tmp/ostk.tgz
          tar -xzf /tmp/ostk.tgz -C /tmp
          install -m 755 /tmp/ostk "$OSTK_BIN/ostk"
          export PATH="$OSTK_BIN:$PATH"
          ostk --version
          ostk boot

      - name: Boot backend (mock LLM), check health and chat stream
        run: |
          set -e
          mkdir -p ~/.youros
          ( cd api && YOUROS_MOCK_LLM=1 python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 & )
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS --connect-timeout 3 -m 5 http://127.0.0.1:8000/api/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Backend never became healthy; last log:"
            cat /tmp/backend.log || true
            exit 1
          fi
          echo "Backend /api/health is 200."
          python scripts/ci_chat_smoke.py ws://127.0.0.1:8000/ws/chat

  # Keep the YOUROS_HOME single-root invariant from rotting: fail if any code
  # under api/ or scripts/ hardcodes ~/.youros instead of using the resolver.
  no-hardcoded-data-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Guard self-test
        run: bash scripts/test_check_no_hardcoded_youros.sh
      - name: No hardcoded ~/.youros outside the resolver
        run: bash scripts/check_no_hardcoded_youros.sh
